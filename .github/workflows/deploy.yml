name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 살린다. 진행 중인 배포는 끊지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # export template 은 1.2GB 다. 버전이 그대로면 받지 않는다.
      - name: Cache export templates
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Install Godot
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          install -m 755 "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

      - name: Install export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          # Web 프리셋만 쓰므로 web_*.zip 과 version.txt 만 푼다. 1.2GB 대신 84MB.
          unzip -q -o -j templates.tpz 'templates/web_*.zip' 'templates/version.txt' -d "$dest"

      # run_tests.sh 가 먼저 --import 를 돌린다. 첫 실행에 .godot/ 가 없어도 된다.
      # GODOT 은 반드시 절대 경로여야 한다 — 스크립트가 -x 로 검사한다.
      - name: Run tests
        run: ./run_tests.sh
        env:
          GODOT: /usr/local/bin/godot

      - name: Export Web build
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          # 아이콘 임포트 부산물이 그대로 배포되지 않게 치운다.
          rm -f build/web/*.import
          # Pages 의 Jekyll 처리를 끈다 — 밑줄로 시작하는 파일이 생겨도 안전하다.
          touch build/web/.nojekyll
          test -s build/web/index.wasm

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
