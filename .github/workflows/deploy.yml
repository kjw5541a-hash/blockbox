name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 살린다. 진행 중인 배포는 끊지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # export template 은 1.2GB 다. 버전이 그대로면 받지 않는다.
      - name: Cache export templates
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Install Godot
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          install -m 755 "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

      - name: Install export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          # Web 프리셋만 쓰므로 web_*.zip 과 version.txt 만 푼다. 1.2GB 대신 84MB.
          unzip -q -o -j templates.tpz 'templates/web_*.zip' 'templates/version.txt' -d "$dest"

      # run_tests.sh 가 먼저 --import 를 돌린다. 첫 실행에 .godot/ 가 없어도 된다.
      # GODOT 은 반드시 절대 경로여야 한다 — 스크립트가 -x 로 검사한다.
      - name: Run tests
        run: ./run_tests.sh
        env:
          GODOT: /usr/local/bin/godot

      # 빌드마다 날짜와 커밋 해시를 박는다. 시작 화면에 그대로 뜨므로 폰에서
      # 지금 보고 있는 것이 새 빌드인지 캐시된 옛 빌드인지 눈으로 구별된다.
      - name: Stamp version
        run: |
          set -euo pipefail
          echo "VERSION=$(date -u +%Y-%m-%d) ${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "BASENAME=blockbox-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Export Web build
        run: |
          set -euo pipefail
          # 따옴표 친 heredoc 이라 셸이 본문을 건드리지 않는다. 정규식의 $ 가
          # 변수로 오해받지 않도록 값은 환경변수로 넘긴다.
          python3 - <<'PY'
          import os, re
          p = 'project.godot'
          s = open(p, encoding='utf-8').read()
          s = re.sub(r'^config/version=.*$',
              'config/version="%s"' % os.environ['VERSION'], s, flags=re.M)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep '^config/version=' project.godot
          mkdir -p build/web
          # 파일 이름에 버전을 넣는다. wasm 과 pck 는 39MB 라 브라우저가 오래
          # 붙잡고 있는데, URL 자체가 바뀌면 캐시가 끼어들 여지가 없다.
          # 안정된 주소가 필요한 index.html 만 복사해 둔다 — 작은 파일이라
          # GitHub Pages 의 max-age=600 이면 충분하다.
          godot --headless --export-release "Web" "build/web/$BASENAME.html"
          cp "build/web/$BASENAME.html" build/web/index.html
          # 아이콘 임포트 부산물이 그대로 배포되지 않게 치운다.
          rm -f build/web/*.import
          # Pages 의 Jekyll 처리를 끈다 — 밑줄로 시작하는 파일이 생겨도 안전하다.
          touch build/web/.nojekyll
          test -s "build/web/$BASENAME.wasm"
          grep -q "$BASENAME.js" build/web/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
